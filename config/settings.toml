# GTA 中心点（多伦多市中心）与半径。实测 40 公里覆盖 22 家影院。
home_lat = 43.6532
home_lon = -79.3832
radius_km = 40

# 排片查询天数。不得小于两期间隔（14 天），否则零星放映的片会落进盲区。
showtime_days = 14
# 即将上映窗口：上映日在运行日之后、不超过这么多天的片入候选。
coming_soon_days = 14

# 活动场里要过滤掉的类别。只对 isEvent 为真的条目生效。
non_film_categories = ["Opera", "Concert", "Stage", "Stage Performance", "Television Event", "Sport"]

shortlist_cap = 15
must_cap = 6
outside_cap = 2
search_max_uses = 5

# 双周门控的锚点，必须是周四。
anchor_date = 2026-10-08
stale_after_days = 16

# 精评（逐片联网调查）用的模型与单价。
model = "claude-sonnet-5-5"
# 费用估算用的 token 单价（美元 / 百万 token）。
price_input_per_mtok = 2.00
price_output_per_mtok = 10.00

# 粗筛单独用更强的模型：它一次调用只要一毛到两毛，却决定哪 15 部进入精评。
# 2026-10-04 实测同一份输入，Sonnet 与 Opus 的入围名单只重合 10–12 部，而 Atonement 这类片
# Opus 每次都选、Sonnet 每次都不选。换模型时单价必须同步改，否则页脚的费用数字是错的。
triage_model = "claude-opus-5-5"
triage_price_input_per_mtok = 4.00
triage_price_output_per_mtok = 20.00

# 联网搜索按次计费，每千次 10 美元（Anthropic 文档；返回错误的搜索不计费，所以页面上的搜索费是上限）。
search_price_per_search = 0.01

timezone = "America/Toronto"
page_url = "https://akasha-r.github.io/film-radar/"
