[project]
name = "film-radar"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "anthropic==1.11.0",
    "requests==2.34.2",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
