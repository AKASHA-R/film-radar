name: research-compare
# 精评的搜索额度对照（诊断用，不属于流水线）。同一部片，用不同的搜索调用方式与提示词各跑一次精评，
# 记下每次搜索、结果、错误的完整时间线。不提交、不部署、不开 Issue。
on:
  workflow_dispatch:
    inputs:
      edition:
        description: "用哪一期的候选与粗筛判定（data/editions 下的文件名，不带 .json）"
        default: "2026-10-04"
      films:
        description: "逗号分隔的 film_id（默认：Ninja Scroll 4K、潘神的迷宫 20 周年、Obsession）"
        default: "61994,62050,60470"
      variants:
        description: "逗号分隔的配置名（默认全部四种）"
        default: "A 基线,B 写明预算,C 直接调用,D 直接调用+写明预算"

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e .
      - name: Run research comparison
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          EDITION: ${{ inputs.edition }}
          FILMS: ${{ inputs.films }}
          VARIANTS: ${{ inputs.variants }}
        run: python scripts/research_compare.py --edition "$EDITION" --films "$FILMS" --variants "$VARIANTS"
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: research-compare
          path: out/research-compare
