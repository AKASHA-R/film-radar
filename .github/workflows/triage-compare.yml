name: triage-compare
# 粗筛稳定性对照（诊断用，不属于流水线）。同一份候选，每个模型各跑几次粗筛，看入围名单稳不稳。
# 只调粗筛，每次一个调用，不联网搜索，不提交、不部署、不开 Issue。
on:
  workflow_dispatch:
    inputs:
      edition:
        description: "用哪一期的候选（data/editions 下的文件名，不带 .json）"
        default: "2026-10-04"
      models:
        description: "逗号分隔的模型 ID"
        default: "claude-sonnet-5-5,claude-opus-5-5"
      runs:
        description: "每个模型跑几次"
        default: "3"

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e .
      - name: Run triage comparison
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          EDITION: ${{ inputs.edition }}
          MODELS: ${{ inputs.models }}
          RUNS: ${{ inputs.runs }}
        run: python scripts/triage_compare.py --edition "$EDITION" --models "$MODELS" --runs "$RUNS"
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: triage-compare
          path: out/triage-compare
